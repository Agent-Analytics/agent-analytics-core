name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code src/tracker.js src/tracker-source.js src/tracker-checksums.js
      - run: npm test

  browser-smoke:
    # Playwright 1.59 has no apt dependency list for Ubuntu 26.04, and
    # ubuntu-latest is 26.04. Pin the image this Playwright release supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: echo "127.0.0.1 aa-smoke.test" | sudo tee -a /etc/hosts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tracker-smoke
